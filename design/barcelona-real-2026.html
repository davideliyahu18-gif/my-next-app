<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>ברצלונה נגד ריאל מדריד 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Heebo", sans-serif;
      background: #050505;
    }

    .story {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: #050505;
    }

    /* Split background: Barça blue/red vs Real white/gold */
    .split-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(164, 0, 0, 0.35) 0%, transparent 45%),
        linear-gradient(225deg, rgba(0, 70, 173, 0.4) 0%, transparent 45%),
        linear-gradient(180deg, #0a0a12 0%, #050505 40%, #0a0805 100%);
    }

    .stadium {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(5,5,5,0.1) 0%, rgba(5,5,5,0.85) 70%, #050505 100%),
        url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1200&q=85") center/cover;
      opacity: 0.45;
    }

    .vs-glow {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.35) 0%, transparent 70%);
      filter: blur(40px);
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 72px 56px 80px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .league {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #d4af37;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(239,68,68,0.2);
      border: 1.5px solid rgba(239,68,68,0.5);
      font-size: 20px;
      font-weight: 900;
      color: #fca5a5;
    }

    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    .clasico {
      margin-top: 36px;
      text-align: center;
    }

    .clasico-label {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.35em;
      color: rgba(212,175,55,0.9);
    }

    .clasico-title {
      margin-top: 12px;
      font-size: 72px;
      font-weight: 900;
      line-height: 1.05;
      background: linear-gradient(135deg, #fff 0%, #d4af37 50%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 24px rgba(212,175,55,0.3));
    }

    .year {
      margin-top: 8px;
      font-size: 120px;
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      line-height: 1;
      letter-spacing: -0.05em;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 200px;
      z-index: -1;
      pointer-events: none;
    }

    .matchup {
      margin-top: 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 28px 32px;
      border-radius: 28px;
      margin: 8px 0;
    }

    .team-row.barca {
      background: linear-gradient(90deg, rgba(0,70,173,0.25) 0%, rgba(164,0,0,0.15) 100%);
      border: 2px solid rgba(0,114,206,0.4);
    }

    .team-row.real {
      background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(212,175,55,0.12) 100%);
      border: 2px solid rgba(212,175,55,0.35);
    }

    .crest {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      flex-shrink: 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    .barca .crest {
      background: linear-gradient(145deg, #0046ad, #a40000);
      border: 3px solid rgba(255,255,255,0.2);
    }

    .real .crest {
      background: linear-gradient(145deg, #fff, #f0e6c8);
      border: 3px solid rgba(212,175,55,0.5);
    }

    .team-info { flex: 1; }

    .team-name {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }

    .team-sub {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 700;
      color: #a1a1aa;
    }

    .barca .team-sub { color: #93c5fd; }
    .real .team-sub { color: #fde68a; }

    .vs {
      text-align: center;
      margin: 16px 0;
    }

    .vs-text {
      display: inline-block;
      width: 88px;
      height: 88px;
      line-height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #a8892f);
      color: #000;
      font-size: 36px;
      font-weight: 900;
      box-shadow: 0 12px 40px rgba(212,175,55,0.5);
    }

    .score-card {
      margin-top: 24px;
      padding: 32px;
      border-radius: 28px;
      text-align: center;
      background: rgba(0,0,0,0.6);
      border: 1.5px solid rgba(212,175,55,0.3);
      backdrop-filter: blur(12px);
    }

    .score {
      font-size: 96px;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
    }

    .minute {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 800;
      color: #fca5a5;
    }

    .meta {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 700;
      color: #d4af37;
    }

    .footer {
      margin-top: auto;
      text-align: center;
    }

    .brand {
      font-size: 26px;
      font-weight: 800;
      color: #d4af37;
    }

    .url {
      margin-top: 12px;
      display: inline-block;
      padding: 18px 36px;
      border-radius: 999px;
      background: #d4af37;
      color: #000;
      font-size: 26px;
      font-weight: 900;
    }

    .flags {
      margin-top: 20px;
      font-size: 20px;
      color: #71717a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="story">
    <div class="split-bg"></div>
    <div class="stadium"></div>
    <div class="vs-glow"></div>
    <div class="year">2026</div>

    <div class="content">
      <div class="top">
        <span class="league">🇪🇸 ליגה ספרדית · EL CLÁSICO</span>
        <span class="live"><span class="dot"></span> LIVE</span>
      </div>

      <div class="clasico">
        <div class="clasico-label">EL CLÁSICO</div>
        <h1 class="clasico-title">הקלאסיקו</h1>
      </div>

      <div class="matchup">
        <div class="team-row barca">
          <div class="crest">🔵🔴</div>
          <div class="team-info">
            <div class="team-name">ברצלונה</div>
            <div class="team-sub">FC Barcelona · קמפ נואו</div>
          </div>
        </div>

        <div class="vs"><span class="vs-text">VS</span></div>

        <div class="team-row real">
          <div class="crest">⚪👑</div>
          <div class="team-info">
            <div class="team-name">ריאל מדריד</div>
            <div class="team-sub">Real Madrid · סנטיאגו ברנבאו</div>
          </div>
        </div>

        <div class="score-card">
          <div class="score">2 — 2</div>
          <div class="minute">78' · מחצית שנייה</div>
          <div class="meta">סעון 2025/26 · ליגה ספרדית</div>
        </div>
      </div>

      <div class="footer">
        <div class="brand">כדורגל בזמן אמת ⚽</div>
        <div class="url">my-next-app-5jte.vercel.app</div>
        <div class="flags">עקוב אחרי הקלאסיקו בזמן אמת</div>
      </div>
    </div>
  </div>
</body>
</html>
